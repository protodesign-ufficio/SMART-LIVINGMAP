<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>AIS Berth Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { background-color:#0f172a; color:#e2e8f0; font-family: monospace; }
        .card { background:#1e293b; border:1px solid #334155; border-radius:0.75rem; }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        
        /* Firefox scrollbar */
        * {
            scrollbar-color: #475569 #0f172a;
            scrollbar-width: thin;
        }
    </style>
</head>

<body class="h-screen w-screen p-6 flex flex-col overflow-hidden">

<div class="flex flex-col gap-6 w-full h-full">

<div class="text-xl font-bold tracking-tight flex items-center gap-2">
    <span class="text-blue-400">AIS Berth Monitor</span>
</div>

<div class="flex flex-1 gap-6 overflow-hidden">

    <div class="w-64 card p-4 flex flex-col overflow-y-auto">
        <div class="text-xs text-slate-400 uppercase mb-2">Ports</div>
        <div id="port-list" class="space-y-2"></div>
    </div>

    <div class="flex-1 flex flex-col gap-4 overflow-hidden">

        <div class="card p-6 grid grid-cols-[auto_1fr_auto_1fr] gap-x-6 gap-y-4 items-center">

            <div class="text-xs text-slate-400 uppercase">Selected Port</div>
            <div id="port-name" class="text-lg font-bold text-blue-300">--</div>

            <div class="text-xs text-slate-400 uppercase">Latitude</div>
            <div id="port-lat" class="text-lg font-bold text-green-400">--</div>

            <div class="text-xs text-slate-400 uppercase">Longitude</div>
            <div id="port-lon" class="text-lg font-bold text-green-400">--</div>

            <div class="text-xs text-slate-400 uppercase">Window (min)</div>
            <div id="window-min" class="text-lg font-bold text-purple-300">--</div>

            <div class="text-xs text-slate-400 uppercase">Status</div>
            <div id="port-status" class="text-lg font-bold text-blue-200">ACTIVE</div>

            <div></div><div></div><div></div><div></div>

            <div class="col-span-4 text-xs text-slate-400 uppercase mt-2 text-center">
                Incoming Vessels Count
            </div>
            <div id="incoming-val" class="col-span-4 text-4xl font-black text-cyan-400 text-center">
                --
            </div>

        </div>

        <div class="flex flex-1 gap-4 overflow-hidden">

            <div class="card p-4 flex-1 flex flex-col overflow-hidden">
                <div class="text-xs text-slate-400 uppercase mb-2">Traffic History</div>
                <canvas id="portChart"></canvas>
            </div>

            <div class="card p-4 w-80 flex flex-col overflow-hidden">
                <div class="text-xs text-slate-400 uppercase mb-2">Incoming vessels</div>
                <div id="incoming-ranking" class="flex-1 overflow-y-auto space-y-2 text-sm">
                    <div class="text-slate-500">--</div>
                </div>
            </div>

        </div>

    </div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script>
const API_BASE_URL = "http://87.26.178.190:15080";
const SOCKET_URL   = "http://localhost:5000";

const urlParams = new URLSearchParams(window.location.search);
let selectedPortFromURL = null;

if (urlParams.has("port")) {
    const portParam = urlParams.get("port").trim().toUpperCase();
    if (portParam) selectedPortFromURL = portParam;
}

const socket = io(SOCKET_URL);

let ports = {};
let selectedPort = null;
const maxPoints = 60;

function generateColor(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
    }
    return `hsl(${Math.abs(hash) % 360}, 70%, 60%)`;
}

async function preloadPorts() {
    try {
        const res = await fetch(`${API_BASE_URL}/porto/lista`);
        if (!res.ok) return;
        const data = await res.json();

        data.forEach(p => {
            const name = p.nome.trim().toUpperCase();

            ports[name] = {
                history: Array(maxPoints).fill(0),
                last: 0,
                window: 0,
                color: generateColor(name),
                details: { lat: p.lat, lon: p.lon },
                detailsLoaded: true,
                incoming_list: []
            };
        });

        renderList();

        // Se c'è un parametro ?port=X, selezionalo
        if (selectedPortFromURL && ports[selectedPortFromURL]) {
            selectPort(selectedPortFromURL);
        } else {
            // Altrimenti, seleziona il primo porto disponibile
            const keys = Object.keys(ports);
            if (keys.length > 0) selectPort(keys[0]);
        }
    } catch {}
}

preloadPorts();

const ctx = document.getElementById("portChart").getContext("2d");
const chart = new Chart(ctx, {
    type: "line",
    data: { labels: Array(maxPoints).fill(""), datasets: [] },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        scales: {
            y: { beginAtZero: true },
            x: { display: false }
        },
        plugins: { legend: { display: false } }
    }
});

function renderList() {
    const list = document.getElementById("port-list");
    list.innerHTML = "";

    Object.keys(ports).sort().forEach(port => {
        const p = ports[port];
        const el = document.createElement("div");
        el.className = `p-2 rounded cursor-pointer border ${
            port === selectedPort ? "bg-blue-900 border-blue-400"
                                  : "bg-slate-800 border-slate-600 hover:bg-slate-700"
        }`;

        el.innerHTML = `
            <div class="font-bold font-mono">${port}</div>
            <div class="text-sm font-bold" style="color:${p.color}">
                ${p.last} incoming
            </div>
        `;
        el.onclick = () => selectPort(port);
        list.appendChild(el);
    });
}

function updateInfo() {
    if (!selectedPort || !ports[selectedPort]) {
        ["port-name","port-lat","port-lon","window-min","incoming-val"]
            .forEach(id => document.getElementById(id).innerText = "--");
        return;
    }

    const p = ports[selectedPort];
    document.getElementById("port-name").innerText = selectedPort;
    document.getElementById("incoming-val").innerText = p.last;
    document.getElementById("window-min").innerText = p.window;

    if (p.details) {
        document.getElementById("port-lat").innerText = p.details.lat?.toFixed(4) || "--";
        document.getElementById("port-lon").innerText = p.details.lon?.toFixed(4) || "--";
    }
}

function updateChart() {
    if (!selectedPort || !ports[selectedPort]) {
        chart.data.datasets = [];
        chart.update();
        return;
    }
    const p = ports[selectedPort];
    chart.data.datasets = [{
        data: p.history,
        borderColor: p.color,
        backgroundColor: p.color + "33",
        fill: true,
        tension: 0.35,
        pointRadius: 0
    }];
    chart.update("none");
}

function updateIncomingRanking() {
    const box = document.getElementById("incoming-ranking");
    box.innerHTML = "";
    if (!selectedPort || !ports[selectedPort]) return;

    const list = ports[selectedPort].incoming_list || [];
    if (!list.length) {
        box.innerHTML = `<div class="text-slate-500">No vessels</div>`;
        return;
    }

    const now = Date.now() / 1000;
    list.forEach((item, i) => {
        const el = document.createElement("div");
        const eta = item.eta;
        const delta = Math.round((eta - now) / 60);
        el.className = "p-2 rounded bg-slate-800 border border-slate-700";
        el.innerHTML = `
            <div class="font-mono text-xs">#${i+1} MMSI ${item.mmsi}</div>
            <div class="text-cyan-300 text-xs">ETA ${new Date(eta*1000).toLocaleTimeString()} (${delta} min)</div>
        `;
        box.appendChild(el);
    });
}

socket.on("analytics_update", msg => {
    if (msg.type !== "berth_incoming") return;
    const port = String(msg.destination).toUpperCase();

    if (!ports[port]) {
        ports[port] = {
            history: Array(maxPoints).fill(0),
            last: 0,
            window: msg.window_future_min,
            color: generateColor(port),
            details: null,
            incoming_list: []
        };
        if (!selectedPort) selectedPort = port;
    }

    ports[port].history.shift();
    ports[port].history.push(msg.incoming_vessels);
    ports[port].last = msg.incoming_vessels;
    ports[port].window = msg.window_future_min;
    ports[port].incoming_list = msg.incoming || [];

    renderList();
    if (selectedPort === port) {
        updateInfo();
        updateChart();
        updateIncomingRanking();
    }
});

function selectPort(port) {
    selectedPort = port;
    renderList();
    updateInfo();
    updateChart();
    updateIncomingRanking();
}
</script>

</body>
</html>
