<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>AIS Delta Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { background-color:#0f172a; color:#e2e8f0; font-family: monospace; }
        .card { background:#1e293b; border:1px solid #334155; border-radius:0.75rem; }
    </style>
</head>

<body class="h-screen w-screen p-6 flex flex-col gap-6 overflow-hidden">

<div class="text-xl font-bold tracking-tight flex items-center gap-2">
    <span class="text-blue-400">AIS Delta Monitor</span>
</div>

<div class="flex flex-1 gap-6 overflow-hidden">

    <!-- SIDEBAR -->
    <div class="w-64 card p-4 flex flex-col overflow-y-auto">
        <div class="text-xs text-slate-400 uppercase mb-2">Vessels</div>
        <div id="ship-list" class="space-y-2"></div>
    </div>

    <!-- MAIN -->
    <div class="flex-1 flex flex-col gap-4 overflow-hidden">

        <!-- TOP PANEL COLLAPSABLE -->
        <div class="card overflow-hidden transition-all duration-300">

            <!-- HEADER -->
            <div class="flex items-center justify-between px-4 py-2 border-b border-slate-700">
                <div class="text-xs text-slate-400 uppercase">Vessel Details</div>
                <button id="toggle-btn"
                        class="text-slate-300 hover:text-white text-sm font-bold select-none">
                    ▲
                </button>
            </div>

            <!-- CONTENT -->
            <div id="top-panel-content"
				class="p-4 grid grid-cols-[1fr_1fr_auto] gap-6 items-start">

				<!-- COLONNA SINISTRA -->
				<div class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-2">
					<div class="text-xs text-slate-400 uppercase">Selected MMSI</div>
					<div id="mmsi" class="text-lg font-bold text-blue-300">--</div>

					<div class="text-xs text-slate-400 uppercase">Vessel Name</div>
					<div id="vessel-name" class="text-lg font-bold text-blue-200">--</div>

					<div class="text-xs text-slate-400 uppercase">Hourly Cost (€)</div>
					<div id="vessel-cost" class="text-lg font-bold text-red-300">--</div>

					<div class="text-xs text-slate-400 uppercase">Departure (sched.)</div>
					<div id="route-departure" class="text-lg font-bold text-green-300">--</div>

					<div class="text-xs text-slate-400 uppercase">Fuel Consumption</div>
					<div id="route-consumption" class="text-lg font-bold text-red-300">--</div>
				</div>

				<!-- COLONNA DESTRA -->
				<div class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-2">
					<div class="text-xs text-slate-400 uppercase">Destination</div>
					<div id="destination" class="text-lg font-bold text-yellow-400">--</div>

					<div class="text-xs text-slate-400 uppercase">ETA</div>
					<div id="eta" class="text-lg font-bold text-green-400">--</div>

					<div class="text-xs text-slate-400 uppercase">Passenger Capacity</div>
					<div id="vessel-capacity" class="text-lg font-bold text-purple-300">--</div>

					<div class="text-xs text-slate-400 uppercase">Max Speed (kn)</div>
					<div id="vessel-speed" class="text-lg font-bold text-orange-300">--</div>

					<div class="text-xs text-slate-400 uppercase">Route ID</div>
					<div id="route-id" class="text-lg font-bold text-cyan-300">--</div>

					<div class="text-xs text-slate-400 uppercase">Travel Time (min)</div>
					<div id="route-time" class="text-lg font-bold text-purple-300">--</div>
				</div>

				<!-- IMMAGINE -->
				<div class="flex items-start justify-center">
					<img id="vessel-image"
						 src=""
						 alt="Vessel image"
						 class="w-48 h-32 object-cover rounded border border-slate-500 shadow-sm hidden" />
				</div>

				<!-- DELTA -->
				<div class="col-span-3 text-xs text-slate-400 uppercase mt-4 text-center">
					Current Delta (minutes)
				</div>
				<div id="delta-val"
					 class="col-span-3 text-3xl font-black text-cyan-400 text-center">
					--
				</div>

            </div>
        </div>

        <!-- GRAPH -->
        <div class="card p-3 flex-1 flex flex-col overflow-hidden">
            <div class="text-xs text-slate-400 uppercase mb-2">Delta History</div>
            <canvas id="deltaChart"></canvas>
        </div>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

<script>
/* =====================================================
   CONFIG
===================================================== */
const API_BASE_URL = "http://87.26.178.190:15080";
const SOCKET_URL   = "http://localhost:5000";

/* =====================================================
   URL FILTER (MMSI)
===================================================== */
const urlParams = new URLSearchParams(window.location.search);
const allowedMMSI = new Set();

if (urlParams.has("mmsi")) {
    urlParams.getAll("mmsi").forEach(v => {
        v.split(",").forEach(m => {
            const t = m.trim();
            if (t) allowedMMSI.add(t);
        });
    });
}

const filterEnabled = allowedMMSI.size > 0;

/* =====================================================
   SOCKET
===================================================== */
const socket = io(SOCKET_URL);

/* =====================================================
   STATE
===================================================== */
let ships = {};
let selectedMMSI = null;
let loadedImageMMSI = null;
const maxPoints = 60;

/* =====================================================
   HELPERS
===================================================== */
function generateColor(mmsi) {
    return `hsl(${parseInt(mmsi) % 360}, 80%, 60%)`;
}

function safeNumber(v) {
    return (typeof v === "number" && isFinite(v)) ? v : null;
}

function formatETA(ts) {
    if (!ts) return "--";
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function formatISO(ts) {
    if (!ts) return "--";
    return new Date(ts).toLocaleString();
}

async function loadVesselInfo(mmsi) {
    try {
        const res = await fetch(`${API_BASE_URL}/vascello/by_mmsi/${mmsi}`);
        if (!res.ok) return null;
        return await res.json();
    } catch {
        return null;
    }
}

async function loadRouteInfo(mmsi) {
    try {
        const res = await fetch(`${API_BASE_URL}/vascello/${mmsi}/percorso_attivo`);
        if (!res.ok) return null;
        return await res.json();
    } catch {
        return null;
    }
}

async function loadVesselImage(mmsi) {
    const img = document.getElementById("vessel-image");
    try {
        const res = await fetch(`${API_BASE_URL}/vascello/${mmsi}/image`);
        if (!res.ok) throw new Error();
        const blob = await res.blob();
        img.src = URL.createObjectURL(blob);
        img.classList.remove("hidden");
        loadedImageMMSI = mmsi;
    } catch {
        img.src = "";
        img.classList.add("hidden");
        loadedImageMMSI = null;
    }
}

function resetAllFields() {
    [
        "mmsi","destination","eta","delta-val",
        "vessel-name","vessel-capacity","vessel-cost","vessel-speed",
        "route-id","route-departure","route-time","route-consumption"
    ].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerText = "--";
    });

    const img = document.getElementById("vessel-image");
    if (img) {
        img.src = "";
        img.classList.add("hidden");
    }
}

/* =====================================================
   PRELOAD VASCELLI (SOLO SE ?mmsi=...)
===================================================== */
async function preloadVessels() {
    for (const mmsi of allowedMMSI) {
        const vessel = await loadVesselInfo(mmsi);
        const route  = await loadRouteInfo(mmsi);

        ships[mmsi] = {
            history: Array(maxPoints).fill(0),
            last_delta: null,
            destination: "--",
            eta: null,
            color: generateColor(mmsi),
            vessel,
            route
        };

        /* ✅ NON caricare l'immagine qui:
           altrimenti updateInfo() -> resetAllFields() la nasconde
           e con 1 solo MMSI non viene più ricaricata. */
    }

    // Render lista subito
    renderList();

    // Se c'è un solo MMSI, forza il flusso corretto (reset -> load image -> render)
    if (allowedMMSI.size === 1) {
        selectShip([...allowedMMSI][0]);
        return;
    }

    // Se sono più di uno, lascia pannello vuoto finché l'utente seleziona (o arriva AIS)
    resetAllFields();
}

if (filterEnabled) preloadVessels();

/* =====================================================
   CHART
===================================================== */
const ctx = document.getElementById("deltaChart").getContext("2d");
const chart = new Chart(ctx, {
    type: "line",
    data: { labels: Array(maxPoints).fill(""), datasets: [] },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        scales: {
            y: {
                min: -30,
                max: 30,
                ticks: { color: "#94a3b8" },
                grid: { color: "rgba(148,163,184,0.2)" }
            },
            x: { display: false }
        },
        plugins: { legend: { display: false } }
    }
});

/* =====================================================
   RENDER SIDEBAR
===================================================== */
function renderList() {
    const list = document.getElementById("ship-list");
    list.innerHTML = "";

    Object.keys(ships).sort().forEach(mmsi => {
        const s = ships[mmsi];
        const isSelected = mmsi === selectedMMSI;

        const deltaText = (s.last_delta !== null)
            ? s.last_delta.toFixed(1)
            : "--";

        const el = document.createElement("div");
        el.className =
            `p-2 rounded cursor-pointer border ${
                isSelected
                    ? "bg-blue-900 border-blue-400"
                    : "bg-slate-800 border-slate-600 hover:bg-slate-700"
            }`;

        el.innerHTML = `
            <div class="font-mono">${mmsi}</div>
            <div class="text-xs text-yellow-300 truncate">${s.destination}</div>
            <div class="text-sm font-bold" style="color:${s.color}">
                ${deltaText}
            </div>
        `;

        el.onclick = () => selectShip(mmsi);
        list.appendChild(el);
    });
}

/* =====================================================
   UPDATE TOP PANEL
===================================================== */
function updateInfo() {
    if (!selectedMMSI || !ships[selectedMMSI]) {
        resetAllFields();
        return;
    }

    const s = ships[selectedMMSI];

    document.getElementById("mmsi").innerText = selectedMMSI;
    document.getElementById("destination").innerText = s.destination ?? "--";
    document.getElementById("eta").innerText = formatETA(s.eta);
    document.getElementById("delta-val").innerText =
        (s.last_delta !== null) ? s.last_delta.toFixed(1) : "--";

    if (s.vessel) {
        document.getElementById("vessel-name").innerText = s.vessel.nome ?? "--";
        document.getElementById("vessel-capacity").innerText =
            s.vessel.capacita_passeggeri ?? "--";
        document.getElementById("vessel-cost").innerText =
            s.vessel.costo_orario_esercizio ?? "--";
        document.getElementById("vessel-speed").innerText =
            s.vessel.velocita_max_nodi ?? "--";
    }

    if (s.route && s.route.percorso) {
        document.getElementById("route-id").innerText =
            s.route.percorso.tratta_id ?? "--";
        document.getElementById("route-departure").innerText =
            formatISO(s.route.percorso.orario_partenza_schedulato);
        document.getElementById("route-time").innerText =
            s.route.percorso.tempo_percorrenza?.toFixed(1) ?? "--";
        document.getElementById("route-consumption").innerText =
            s.route.percorso.consumo?.toFixed(1) ?? "--";
    }
}

/* =====================================================
   UPDATE CHART
===================================================== */
function updateChart() {
    if (!selectedMMSI || !ships[selectedMMSI]) return;

    const s = ships[selectedMMSI];
    chart.data.datasets = [{
        data: s.history,
        borderColor: s.color,
        backgroundColor: s.color + "33",
        borderWidth: 2,
        tension: 0.35,
        pointRadius: 0,
        fill: true
    }];
    chart.update("none");
}

/* =====================================================
   SOCKET HANDLER
===================================================== */
socket.on("analytics_update", msg => {
    const mmsi = String(msg.mmsi);
    if (filterEnabled && !allowedMMSI.has(mmsi)) return;

    const delta = safeNumber(msg.delta_min);

    if (!ships[mmsi]) {
        ships[mmsi] = {
            history: Array(maxPoints).fill(0),
            last_delta: delta,
            destination: msg.destination || "UNKNOWN",
            eta: msg.eta || null,
            color: generateColor(mmsi),
            vessel: null,
            route: null
        };
    }

    if (delta !== null) {
        ships[mmsi].history.shift();
        ships[mmsi].history.push(delta);
        ships[mmsi].last_delta = delta;
    }

    ships[mmsi].destination = msg.destination || ships[mmsi].destination;
    ships[mmsi].eta = msg.eta || ships[mmsi].eta;

    if (!selectedMMSI) {
        selectedMMSI = mmsi;
        loadVesselImage(mmsi);
    }

    renderList();
    if (selectedMMSI === mmsi) updateInfo();
    updateChart();
});

/* =====================================================
   SELECTION
===================================================== */
function selectShip(mmsi) {
    selectedMMSI = mmsi;
    resetAllFields();
    loadVesselImage(mmsi);
    renderList();
    updateInfo();
    updateChart();
}

/* =====================================================
   COLLAPSE LOGIC
===================================================== */
const toggleBtn = document.getElementById("toggle-btn");
const panelContent = document.getElementById("top-panel-content");

let collapsed = false;

toggleBtn.onclick = () => {
    collapsed = !collapsed;
    panelContent.style.display = collapsed ? "none" : "grid";
    toggleBtn.innerText = collapsed ? "▼" : "▲";
    setTimeout(() => chart.resize(), 300);
};
</script>

</body>
</html>
