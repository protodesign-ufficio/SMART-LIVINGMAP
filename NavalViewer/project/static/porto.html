<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>AIS Berth Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { background-color:#0f172a; color:#e2e8f0; font-family: monospace; }
        .card { background:#1e293b; border:1px solid #334155; border-radius:0.75rem; }
    </style>
</head>

<body class="h-screen w-screen p-6 flex flex-col gap-6 overflow-hidden">

<div class="text-xl font-bold tracking-tight flex items-center gap-2">
    <span class="text-blue-400">AIS Berth Monitor</span>
    <span class="text-slate-600 text-sm">(Kafka → WebSocket)</span>
</div>

<div class="flex flex-1 gap-6 overflow-hidden">

    <div class="w-64 card p-4 flex flex-col overflow-y-auto">
        <div class="text-xs text-slate-400 uppercase mb-2">Ports</div>
        <div id="port-list" class="space-y-2"></div>
    </div>

    <div class="flex-1 flex flex-col gap-4 overflow-hidden">

        <div class="card p-6 grid grid-cols-[auto_1fr_auto_1fr] gap-x-6 gap-y-4 items-center">

            <div class="text-xs text-slate-400 uppercase">Selected Port</div>
            <div id="port-name" class="text-lg font-bold text-blue-300">--</div>

            <div class="text-xs text-slate-400 uppercase">System ID</div>
            <div id="port-id" class="text-lg font-bold text-yellow-400 truncate">--</div>

            <div class="text-xs text-slate-400 uppercase">Latitude</div>
            <div id="port-lat" class="text-lg font-bold text-green-400">--</div>

            <div class="text-xs text-slate-400 uppercase">Longitude</div>
            <div id="port-lon" class="text-lg font-bold text-green-400">--</div>

            <div class="text-xs text-slate-400 uppercase">Window (min)</div>
            <div id="window-min" class="text-lg font-bold text-purple-300">--</div>

            <div class="text-xs text-slate-400 uppercase">Status</div>
            <div id="port-status" class="text-lg font-bold text-blue-200">ACTIVE</div>

            <div></div>
            <div></div>
            <div></div>
            <div></div>

            <div class="col-span-4 text-xs text-slate-400 uppercase mt-2 text-center">
                Incoming Vessels Count
            </div>
            <div id="incoming-val" class="col-span-4 text-4xl font-black text-cyan-400 text-center">
                --
            </div>

        </div>

        <div class="card p-4 flex-1 flex flex-col overflow-hidden">
            <div class="text-xs text-slate-400 uppercase mb-2">Traffic History</div>
            <canvas id="portChart"></canvas>
        </div>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script>
/* =====================================================
   CONFIGURAZIONE
===================================================== */
// URL aggiornato secondo richiesta
const API_BASE_URL = "http://87.26.178.190:15080"; 
// Socket separato come nel file di riferimento (modifica se necessario)
const SOCKET_URL   = "http://localhost:5000"; 

/* =====================================================
   URL FILTER (PORT)
===================================================== */
const urlParams = new URLSearchParams(window.location.search);
const allowedPorts = new Set();

if (urlParams.has("port")) {
    urlParams.getAll("port").forEach(v => {
        v.split(",").forEach(p => {
            const t = p.trim().toUpperCase();
            if (t) allowedPorts.add(t);
        });
    });
}

const filterEnabled = allowedPorts.size > 0;

/* =====================================================
   SOCKET
===================================================== */
const socket = io(SOCKET_URL);

/* =====================================================
   STATE
===================================================== */
let ports = {};          
let selectedPort = null;
const maxPoints = 60;

/* =====================================================
   HELPERS
===================================================== */
function generateColor(name) {
    // Generazione colore deterministica basata sul nome
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
    }
    return `hsl(${Math.abs(hash) % 360}, 70%, 60%)`;
}

async function fetchPortDetails(portName) {
    try {
        const url = `${API_BASE_URL}/porto/by_name/${encodeURIComponent(portName)}`;
        const res = await fetch(url);
        if (!res.ok) return null;
        return await res.json();
    } catch (e) {
        console.error("Fetch error:", e);
        return null;
    }
}

/* =====================================================
   CHART
===================================================== */
const ctx = document.getElementById("portChart").getContext("2d");
const chart = new Chart(ctx, {
    type: "line",
    data: { labels: Array(maxPoints).fill(""), datasets: [] },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        scales: {
            y: {
                beginAtZero: true,
                ticks: { color: "#94a3b8" },
                grid: { color: "rgba(148,163,184,0.2)" }
            },
            x: { display: false }
        },
        plugins: { legend: { display: false } }
    }
});

/* =====================================================
   RENDER SIDEBAR
===================================================== */
function renderList() {
    const list = document.getElementById("port-list");
    list.innerHTML = "";

    Object.keys(ports).sort().forEach(port => {
        const p = ports[port];
        const isSelected = port === selectedPort;

        const el = document.createElement("div");
        el.className =
            `p-2 rounded cursor-pointer border ${
                isSelected
                    ? "bg-blue-900 border-blue-400"  // Stile "Blue" come Delta Monitor
                    : "bg-slate-800 border-slate-600 hover:bg-slate-700"
            }`;

        el.innerHTML = `
            <div class="font-bold font-mono">${port}</div>
            <div class="text-sm font-bold" style="color:${p.color}">
                ${p.last} incoming
            </div>
        `;

        el.onclick = () => selectPort(port);
        list.appendChild(el);
    });
}

/* =====================================================
   UPDATE INFO
===================================================== */
async function updateInfo() {
    if (!selectedPort || !ports[selectedPort]) {
        ["port-name","port-id","port-lat","port-lon","window-min","incoming-val"]
            .forEach(id => document.getElementById(id).innerText = "--");
        return;
    }

    const p = ports[selectedPort];

    // Caricamento Lazy dei dettagli API se mancano
    if (!p.detailsLoaded) {
        p.detailsLoaded = true; // Evita loop
        p.details = await fetchPortDetails(selectedPort);
    }

    // Aggiornamento UI
    document.getElementById("port-name").innerText = selectedPort;
    document.getElementById("incoming-val").innerText = p.last;
    document.getElementById("window-min").innerText = p.window;

    // Dati da API (se disponibili)
    if (p.details) {
        document.getElementById("port-id").innerText = p.details.id || "--";
        document.getElementById("port-lat").innerText = p.details.lat ? p.details.lat.toFixed(4) : "--";
        document.getElementById("port-lon").innerText = p.details.lon ? p.details.lon.toFixed(4) : "--";
    } else {
        document.getElementById("port-id").innerText = "--";
        document.getElementById("port-lat").innerText = "--";
        document.getElementById("port-lon").innerText = "--";
    }
}

/* =====================================================
   UPDATE CHART
===================================================== */
function updateChart() {
    if (!selectedPort || !ports[selectedPort]) {
        chart.data.datasets = [];
        chart.update();
        return;
    }

    const p = ports[selectedPort];

    chart.data.datasets = [{
        data: p.history,
        borderColor: p.color,
        backgroundColor: p.color + "33",
        borderWidth: 2,
        tension: 0.35,
        pointRadius: 0,
        fill: true
    }];

    chart.update("none");
}

/* =====================================================
   SOCKET HANDLER
===================================================== */
socket.on("analytics_update", msg => {
    if (msg.type !== "berth_incoming") return;

    const port = String(msg.destination).toUpperCase();
    if (filterEnabled && !allowedPorts.has(port)) return;

    const incoming = Number(msg.incoming_vessels);
    if (!isFinite(incoming)) return;

    const windowMin = Number(msg.window_future_min) || 0;

    if (!ports[port]) {
        ports[port] = {
            history: Array(maxPoints).fill(0),
            last: incoming,
            window: windowMin,
            color: generateColor(port),
            details: null,       // Dati API
            detailsLoaded: false // Flag caricamento
        };
        // Auto-selezione al primo evento
        if (!selectedPort) selectedPort = port;
    }

    ports[port].history.shift();
    ports[port].history.push(incoming);
    ports[port].last = incoming;
    ports[port].window = windowMin;

    renderList();
    
    // Aggiorna dettagli solo se è il porto visualizzato
    if (selectedPort === port) {
        updateInfo();
        updateChart();
    }
});

/* =====================================================
   SELECTION
===================================================== */
function selectPort(port) {
    selectedPort = port;
    renderList();
    updateInfo();
    updateChart();
}
</script>

</body>
</html>
