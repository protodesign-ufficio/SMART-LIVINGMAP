<!DOCTYPE html>
<html lang="it">
<head>

    <title>Sales Forecast TravelMar</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

<body class="h-screen w-screen p-6 flex flex-col overflow-hidden">

<div class="flex flex-col gap-6 w-full h-full">


    <!-- HEADER -->
    <div class="text-xl font-bold tracking-tight flex items-center gap-2">
        <span class="text-blue-400">Travelmar Sales Forecast</span>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-[260px_380px_1fr] gap-6 flex-1 overflow-hidden">
    
		<!-- COLONNA CORSE -->
		<div class="card p-4 flex flex-col overflow-y-auto h-full">
			<div class="text-xs text-slate-400 uppercase mb-3">Corse</div>
			<div id="corse-list" class="space-y-2 text-sm text-slate-300">
				<div class="text-slate-500">Seleziona una data</div>
			</div>
		</div>


        <!-- INPUT -->
        <div class="space-y-6 flex flex-col h-full">

            <!-- Parametri -->
            <div class="card p-5">
                <div class="text-xs text-slate-400 uppercase mb-4">Parametri Corsa</div>

                <div class="space-y-4">

                    <div>
                        <label class="text-xs text-slate-400 uppercase">Giorno Target</label>
                        <input type="date" id="giorno_target" class="w-full p-2 rounded">
                    </div>

                    <div>
                        <label class="text-xs text-slate-400 uppercase">Tratta</label>
                        <select id="tratta" class="w-full p-2 rounded"></select>
                    </div>

                    <div>
                        <label class="text-xs text-slate-400 uppercase">Orario</label>
                        <select id="orario" class="w-full p-2 rounded"></select>
                    </div>

                    <div>
                        <label class="text-xs text-slate-400 uppercase">Meteo previsto</label>
                        <div id="meteo_info"
                             class="p-2 rounded bg-slate-800 border border-slate-600">
                            -
                        </div>
                    </div>

                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" id="festivo">
                        Festivo non-rosso
                    </label>
                </div>
            </div>

            <!-- Vendite -->
            <div class="card p-5">
                <div class="text-xs text-slate-400 uppercase mb-4">Dati Vendita</div>

                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-slate-400 uppercase">Giorni alla partenza</label>
                        <div id="giorni_partenza_info"
                             class="p-2 rounded bg-slate-800 border border-slate-600">
                            -
                        </div>
                    </div>

                    <div>
                        <label class="text-xs text-slate-400 uppercase">Biglietti venduti</label>
                        <input type="number" id="biglietti_venduti" value="50"

			<button
				onclick="calcolaPrevisione()"
				id="btn-calcola"

					   text-white font-bold
					   py-3 px-6
					   rounded-lg
					   text-center
					   flex items-center justify-center">
				Calcola Previsione
			</button>


            <div id="error-box"
                 class="hidden bg-red-900/30 border border-red-700 text-red-400 p-3 rounded text-sm flex gap-2">
                <i data-lucide="alert-circle"></i>
                <span id="error-msg"></span>
            </div>

        </div>

		<!-- RISULTATI -->
		<div class="flex flex-col h-full">

			<!-- PLACEHOLDER -->
			<div id="placeholder-state"
				 class="flex-1 card flex flex-col items-center justify-center text-slate-500">
				<i data-lucide="cloud-sun" class="w-14 h-14 mb-3 opacity-40"></i>
				Inserisci i dati ed esegui la previsione
			</div>

				 class="hidden flex-1 flex flex-col space-y-6 overflow-y-auto">

				<!-- Finale -->
				<div class="card p-6 text-center">
					<div class="text-xs text-slate-400 uppercase mb-2">Previsione Finale</div>

						<span id="res-finale">0</span>
					</div>
					<div id="ci-finale" class="text-slate-400 text-sm mt-2"></div>
				</div>

                <!-- Breakdown -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                    <div class="card p-4 min-h-[140px] flex flex-col justify-between">
                        <div class="text-xs text-slate-400 uppercase leading-tight">Biglietti giornalieri totali previsti</div>
                        <div id="res-macro" class="text-2xl font-bold text-blue-300">0</div>
                        <div id="ci-macro"></div>
                    </div>

                    <div class="card p-4 min-h-[140px] flex flex-col justify-between">
                        <div class="text-xs text-slate-400 uppercase leading-tight">Biglietti giornalieri per quella specificata tratta</div>
                        <div id="res-base" class="text-2xl font-bold text-yellow-300">0</div>
                        <div id="ci-base"></div>
                    </div>

                    <div class="card p-4 relative min-h-[140px] flex flex-col justify-between">
                        <div id="bar-adjust" class="absolute right-0 top-0 w-1 h-full bg-green-500"></div>
                        <div class="text-xs text-slate-400 uppercase leading-tight">Fattore di Correzione</div>
                        <div id="res-adjust" class="text-2xl font-bold text-green-400">+0</div>
                        <div id="ci-adjust"></div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- SCRIPT -->
<script>
const BACKEND = "http://87.26.178.190:25080";

let selectedCorsaId = null; // Questo ora conterrà l'UUID
let corseDelGiorno = [];

/////////////////////////////////////////////
// 0. DATA MINIMA / DEFAULT = OGGI (SE NO URL)
/////////////////////////////////////////////
const inputData = document.getElementById("giorno_target");
document.getElementById("giorno_target")
    .addEventListener("change", async () => {
        await loadCorseGiornaliere();
        aggiornaSelectTratte();
        await loadOrari();
    });

const oggi = new Date().toISOString().split("T")[0];
inputData.setAttribute("min", oggi);

const params = new URLSearchParams(window.location.search);

if (!params.has("corsa")) {
    inputData.value = oggi;
}


/////////////////////////////////////////////
// 0. LOAD PER BARRA LATERALE
/////////////////////////////////////////////
async function loadCorseGiornaliere() {
    const data = document.getElementById("giorno_target").value;
    const box = document.getElementById("corse-list");
    box.innerHTML = "";

    if (!data) {
        box.innerHTML = `<div class="text-slate-500">Seleziona una data</div>`;
        return;
    }
    
    try {
        const res = await fetch(`${BACKEND}/corsa/giorno?giorno=${data}`);
        if (!res.ok) {
            box.innerHTML = `<div class="text-red-400">Errore caricamento corse</div>`;
            return;
        }

        const corse = await res.json();
        corseDelGiorno = corse;

        if (!corse.length) {
            box.innerHTML = `<div class="text-slate-500">Nessuna corsa</div>`;
            return;
        }

        corse.forEach(c => {
            // MODIFICA: Usiamo l'UUID reale dal database
            const isSelected = c.id === selectedCorsaId;
            
            const el = document.createElement("div");
            el.className =
                "p-2 rounded border cursor-pointer " +
                (isSelected
                    ? "bg-blue-900 border-blue-400 ring-2 ring-blue-400"
                    : "bg-slate-800 border-slate-600 hover:bg-slate-700");

            el.innerHTML = `
                <div class="font-mono text-xs">${c.tratta}</div>
                <div class="text-cyan-300 font-bold">${c.orario}</div>
            `;

            el.onclick = () => selezionaCorsa(c);
            box.appendChild(el);
        });

    } catch (e) {
        console.error(e);
        box.innerHTML = `<div class="text-red-400">Backend non raggiungibile</div>`;
    }
}

async function selezionaCorsa(c) {
    // MODIFICA: Salviamo l'UUID
    selectedCorsaId = c.id;

    const trattaSel = document.getElementById("tratta");
    trattaSel.value = c.tratta;

    await loadOrari();

    const orarioSel = document.getElementById("orario");
    // c.orario arriva come "09:30", la select usa "0930"
    orarioSel.value = c.orario.replace(":", "");

    renderCorseSidebar();
}

function renderCorseSidebar() {
    const box = document.getElementById("corse-list");
    box.innerHTML = "";

    corseDelGiorno.forEach(c => {
        // Confronto su UUID
        const isSelected = c.id === selectedCorsaId;

        const el = document.createElement("div");
        el.className =
            "p-2 rounded border cursor-pointer " +
            (isSelected
                ? "bg-blue-900 border-blue-400 ring-2 ring-blue-400"
                : "bg-slate-800 border-slate-600 hover:bg-slate-700");

        el.innerHTML = `
            <div class="font-mono text-xs">${c.tratta}</div>
            <div class="text-cyan-300 font-bold">${c.orario}</div>
        `;

        el.onclick = () => selezionaCorsa(c);
        box.appendChild(el);
    });
}

/////////////////////////////////////////////
// AGGIORNA SELECT TRATTE (SELEZIONE CORSA)
/////////////////////////////////////////////
async function aggiornaSelectTratte() {
    const sel = document.getElementById("tratta");
    sel.innerHTML = "";

    if (!corseDelGiorno.length) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "Nessuna tratta disponibile";
        sel.appendChild(opt);
        return;
    }

    // Popola le opzioni (Nomi Tratta univoci)
    const tratteUniche = [...new Set(corseDelGiorno.map(c => c.tratta))];
    tratteUniche.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = t;
        sel.appendChild(opt);
    });

    // SELEZIONE AUTOMATICA:
    // Se abbiamo una corsa selezionata (selectedCorsaId), selezioniamo la sua tratta
    if (selectedCorsaId) {
        const found = corseDelGiorno.find(c => c.id === selectedCorsaId);
        if (found && tratteUniche.includes(found.tratta)) {
            sel.value = found.tratta;
            // Carica orari e attende la fine prima di selezionare l'orario
            await loadOrari(); 
            return;
        }
    }

    // Fallback: seleziona la prima tratta se quella attuale non è valida
    if (!tratteUniche.includes(sel.value)) {
        sel.value = tratteUniche[0];
    }
    await loadOrari();
}

/////////////////////////////////////////////
// CARICAMENTO TRATTE E ORARI DAL BACKEND
/////////////////////////////////////////////
async function loadTratte() {
    // Questa funzione caricava tutte le tratte possibili. 
    // Ora è meglio affidarsi a quelle disponibili per il giorno (loadCorseGiornaliere)
    // O usare l'endpoint /tratta/lista che ora restituisce ID e NOME.
    const sel = document.getElementById("tratta");
    sel.innerHTML = "";

    try {
        const res = await fetch(`${BACKEND}/tratta/lista`);
        if (!res.ok) return;
        const data = await res.json();

        data.forEach(t => {
            const opt = document.createElement("option");
            // Nota: t.id ora è un UUID, t.nome è "SAL-AMA"
            // Se la select deve guidare gli orari, usiamo t.id (UUID)
            // MA attenzione: /corsa/orari/{tratta_id} vuole l'UUID.
            opt.value = t.id;       
            opt.textContent = t.nome; // Mostriamo il nome leggibile
            sel.appendChild(opt);
        });

        await loadOrari();
    } catch (e) {
        console.error("Eccezione loadTratte:", e);
    }
}

/////////////////////////////////////////////
// URL PARAM (AUTO-COMPILAZIONE CORSA)
/////////////////////////////////////////////
async function applyCorsaFromUrl() {
    const params = new URLSearchParams(window.location.search);
    if (!params.has("corsa")) return;

    const param = params.get("corsa").trim();
    
    // Controlliamo se è un UUID (36 caratteri, numeri e lettere a-f)
    const isUUID = /^[0-9a-fA-F-]{36}$/.test(param);

    if (isUUID) {
        // --- CASO 1: È UN UUID ---
        try {
            // 1. Chiediamo al backend i dettagli per sapere la DATA
            const res = await fetch(`${BACKEND}/corsa/${param}`);
            if (!res.ok) return; 
            const dataCorsa = await res.json();

            // 2. Estraiamo la data (es: "2026-01-21T10:30:00" -> "2026-01-21")
            const dataIso = dataCorsa.orario_partenza_schedulato.split("T")[0];
            document.getElementById("giorno_target").value = dataIso;
            
            // 3. Impostiamo lo stato globale
            selectedCorsaId = param;

            // 4. Carichiamo le corse di quel giorno
            await loadCorseGiornaliere();
            
            // 5. Aggiorniamo le tendine (Tratta -> Orario)
            // Nota: aggiornaSelectTratte ora è intelligente e userà selectedCorsaId
            await aggiornaSelectTratte();

        } catch (e) {
            console.error("Errore recupero corsa da UUID", e);
        }

    } else {
        // --- CASO 2: VECCHIO FORMATO STRINGA (SAL-AMA-2025...) ---
        const match = param.match(/^(.+)-(\d{8})-(\d{4})$/);
        if (match) {
            const dataUrl = match[2];
            const dataISO = dataUrl.slice(0,4) + "-" + dataUrl.slice(4,6) + "-" + dataUrl.slice(6,8);
            document.getElementById("giorno_target").value = dataISO;

            await loadCorseGiornaliere();

            // Cerchiamo l'UUID reale corrispondente a Tratta e Orario della stringa
            const trattaNome = match[1];
            const orarioHHMM = match[3];
            const orarioFormatted = orarioHHMM.slice(0,2) + ":" + orarioHHMM.slice(2,4);

            const found = corseDelGiorno.find(c => c.tratta === trattaNome && c.orario === orarioFormatted);
            if (found) {
                selectedCorsaId = found.id;
                await aggiornaSelectTratte();
            }
        }
    }
}

async function loadOrari() {
    const trattaNome = document.getElementById("tratta").value;
    const dataSel  = document.getElementById("giorno_target").value;
    const sel = document.getElementById("orario");
    sel.innerHTML = "";

    if (!trattaNome || !dataSel) return;

    // Dobbiamo trovare l'UUID della tratta partendo dal Nome, 
    // perché l'endpoint /corsa/orari/{id} vuole l'UUID della tratta.
    let trattaIdUuid = null;
    const corsaEsempio = corseDelGiorno.find(c => c.tratta === trattaNome);
    if (corsaEsempio) {
        trattaIdUuid = corsaEsempio.tratta_id; // Assicurati che /corsa/giorno restituisca questo campo
    }

    // Fallback: se non troviamo l'UUID della tratta nei dati locali, proviamo a usare il nome
    // (ma funzionerà solo se il backend accetta nomi, altrimenti fallirà)
    const idPerChiamata = trattaIdUuid || trattaNome;

    try {
        const res = await fetch(`${BACKEND}/corsa/orari/${idPerChiamata}?data=${dataSel}`);
        if (!res.ok) return;

        const data = await res.json();
        
        if (!data.orari || data.orari.length === 0) {
            const opt = document.createElement("option");
            opt.value = "";
            opt.textContent = "Nessun orario";
            sel.appendChild(opt);
            return;
        }

        data.orari.forEach(o => {
            const hhmm = o.replace(":", "");
            const opt = document.createElement("option");
            opt.value = hhmm;
            opt.textContent = o;
            sel.appendChild(opt);
        });

        // SELEZIONE AUTOMATICA ORARIO:
        // Se c'è una corsa selezionata, selezioniamo il suo orario
        if (selectedCorsaId) {
            const found = corseDelGiorno.find(c => c.id === selectedCorsaId);
            if (found && found.tratta === trattaNome) {
                const orarioClean = found.orario.replace(":", ""); // "09:30" -> "0930"
                sel.value = orarioClean;
            }
        }

    } catch (e) {
        console.error("Eccezione loadOrari:", e);
    }
}

document.getElementById("tratta").addEventListener("change", async () => {
    await loadOrari();
    trySyncSelection();
});


document.getElementById("orario").addEventListener("change", () => {
    trySyncSelection();
});

function trySyncSelection() {
    const trattaNome = document.getElementById("tratta").options[document.getElementById("tratta").selectedIndex]?.text;
    const orarioHHMM = document.getElementById("orario").value; // "0930"
    
    if (!trattaNome || !orarioHHMM) return;
    
    const orarioFormatted = orarioHHMM.slice(0,2) + ":" + orarioHHMM.slice(2,4);

    const found = corseDelGiorno.find(c => c.tratta === trattaNome && c.orario === orarioFormatted);
    
    if (found) {
        selectedCorsaId = found.id;
        renderCorseSidebar();
    } else {
        selectedCorsaId = null;
        renderCorseSidebar();
    }
}



// carico tratte all'avvio
(async () => {
    // 1. Carica i dati della giornata (default oggi) e popola la sidebar
    await loadCorseGiornaliere(); 

    // 2. Controlla l'URL
    const params = new URLSearchParams(window.location.search);

    if (params.has("corsa")) {
        // Se c'è il parametro, questa funzione seleziona e aggiorna tutto
        await applyCorsaFromUrl();
    } else {
        // CORREZIONE: Se NON c'è parametro, forziamo l'aggiornamento delle tendine
        // prendendo la prima tratta/corsa disponibile.
        aggiornaSelectTratte();
    }
})();


/////////////////////////////////////////////
// 3. CALCOLO PREVISIONE
/////////////////////////////////////////////
async function calcolaPrevisione() {

    // MODIFICA FONDAMENTALE: Dobbiamo recuperare l'UUID della corsa.
    // Non possiamo costruirlo come stringa.
    
    // Se l'utente ha cliccato sulla sidebar o i dropdown corrispondono a una corsa esistente:
    let corsaUuid = selectedCorsaId;

    // Se selectedCorsaId è null (magari ha cambiato dropdown senza cliccare sidebar), riproviamo a cercarlo
    if (!corsaUuid) {
        const trattaNome = document.getElementById("tratta").options[document.getElementById("tratta").selectedIndex]?.text;
        const orarioHHMM = document.getElementById("orario").value;
        const orarioFormatted = orarioHHMM.slice(0,2) + ":" + orarioHHMM.slice(2,4);
        
        const found = corseDelGiorno.find(c => c.tratta === trattaNome && c.orario === orarioFormatted);
        if (found) {
            corsaUuid = found.id;
        }
    }

    const venduti = parseFloat(document.getElementById("biglietti_venduti").value);
    const festivo = document.getElementById("festivo").checked;

    const btn = document.getElementById("btn-calcola");
    const errorBox = document.getElementById("error-box");
    const errorMsg = document.getElementById("error-msg");
    errorBox.classList.add("hidden");
    errorMsg.innerText = "";

    if (!corsaUuid) {
        errorBox.classList.remove("hidden");
        errorMsg.innerText = "Nessuna corsa valida trovata per i parametri selezionati (Tratta/Orario non corrispondono a una corsa programmata).";
        return;
    }

    btn.innerText = "Calcolo in corso…";
    btn.disabled = true;

    try {
        const bodyPred = {
            biglietti_venduti_al_sample: venduti,
            festivo: festivo
        };

        // Chiamata usando UUID
        const res = await fetch(`${BACKEND}/corsa/${corsaUuid}/prevedi?disable_cache=true`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(bodyPred)
        });

        if (res.status === 404) {
            const j = await res.json();
            errorBox.classList.remove("hidden");
            errorMsg.innerText = j.detail || "Corsa non trovata.";
            btn.innerHTML = '<i data-lucide="calculator" class="w-5 h-5"></i> Calcola Previsione';
            btn.disabled = false;
            lucide.createIcons();
            return;
        }

        if (!res.ok) {
            const j = await res.text();
            errorBox.classList.remove("hidden");
            errorMsg.innerText = "Errore durante la previsione: " + res.status;
            btn.innerHTML = '<i data-lucide="calculator" class="w-5 h-5"></i> Calcola Previsione';
            btn.disabled = false;
            lucide.createIcons();
            return;
        }

        const pred = await res.json();
        const data = pred.dettagli; 

        // --- Aggiornamento UI (invariato) ---
        document.getElementById("meteo_info").innerText = data.meteo_auto ?? "-";
        document.getElementById("giorni_partenza_info").innerText = data.giorni_alla_partenza_auto + " giorni";
        
        document.getElementById("res-finale").innerText = data.micro_finale;
        document.getElementById("ci-finale").innerText = `Intervallo di confidenza al 95%: ${data.micro_finale_ci_95[0]} – ${data.micro_finale_ci_95[1]}`;

        document.getElementById("res-macro").innerText = data.totali_previsti;
        ciBadge("ci-macro", data.totali_ci_95[0], data.totali_ci_95[1], data.totali_previsti);

        document.getElementById("res-base").innerText = data.micro_base;
        ciBadge("ci-base", data.micro_base_ci_95[0], data.micro_base_ci_95[1], data.micro_base);

        const adjEl = document.getElementById("res-adjust");
        const barEl = document.getElementById("bar-adjust");
        const adj = data.micro_adjust;

        adjEl.innerText = (adj >= 0 ? "+" : "") + adj;
        if (adj < 0) {
            adjEl.className = "text-2xl font-semibold text-red-600";
            barEl.className = "absolute top-0 right-0 w-1 h-full bg-red-500";
        } else {
            adjEl.className = "text-2xl font-semibold text-green-600";
            barEl.className = "absolute top-0 right-0 w-1 h-full bg-green-500";
        }
        ciBadge("ci-adjust", data.micro_adjust_ci_95[0], data.micro_adjust_ci_95[1], adj);

        document.getElementById("placeholder-state").classList.add("hidden");
        document.getElementById("results-container").classList.remove("hidden");

    } catch (e) {
        console.error("Eccezione calcolaPrevisione:", e);
        errorBox.classList.remove("hidden");
        errorMsg.innerText = "Errore di comunicazione con il backend.";
    }

    btn.innerText = "Calcola Previsione";
    btn.disabled = false;
}
function ciBadge(id, low, high, estimate) {
    const el = document.getElementById(id);
    const width = (high - low) / Math.max(estimate, 1);
    let cls = "bg-green-100 text-green-700 border border-green-300";
    if (width > 0.25) cls = "bg-red-100 text-red-700 border border-red-300";
    else if (width > 0.10) cls = "bg-yellow-100 text-yellow-700 border border-yellow-300";
    el.className = "text-xs mt-2 px-2 py-1 rounded font-medium w-fit " + cls;
    el.textContent = `CI 95%: ${Math.round(low)} – ${Math.round(high)}`;
}
