<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Analytics · v2026-05-20-ui-refresh</title>
  <script src="https://cdn.tailwindcss.com"></script>
    <style>
    /* Rimuove outline e bordi focus */
    button:focus, button:active {
      outline: none !important;
      box-shadow: none !important;
      border: none !important;
    }

    html, body { font-family: 'Segoe UI'; } 
    
    iframe { display: block; }
    aside::-webkit-scrollbar { display: none; }
  </style>
</head>

<body class="h-screen flex bg-slate-950 text-slate-200 antialiased overflow-hidden">

  <aside class="w-72 bg-slate-900 border-r border-slate-800 flex flex-col">
    
    <div class="p-6 pb-4">
      <div class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">
        Dashboard
      </div>
      <h1 class="text-xl font-semibold text-white tracking-tight">Analytics</h1>
    </div>

    <nav class="flex-1 px-3 space-y-3 mt-2">
      
      <button data-route="/componenti"
        class="nav-btn w-full text-left pl-6 pr-4 py-4 text-sm font-bold rounded-xl transition-all duration-200">
        Monitor Componenti
      </button>

      <button data-route="/porto"
        class="nav-btn w-full text-left pl-6 pr-4 py-4 text-sm font-bold rounded-xl transition-all duration-200">
        Monitor Banchine
      </button>

      <button data-route="/vascello"
        class="nav-btn w-full text-left pl-6 pr-4 py-4 text-sm font-bold rounded-xl transition-all duration-200">
        Monitor Vascelli
      </button>

      <button data-route="/previsione_domanda"
        class="nav-btn w-full text-left pl-6 pr-4 py-4 text-sm font-bold rounded-xl transition-all duration-200">
        Monitor Vendite
      </button>

      <button data-route="/modello_consumo"
        class="nav-btn w-full text-left pl-6 pr-4 py-4 text-sm font-bold rounded-xl transition-all duration-200">
        Monitor Consumi
      </button>

    </nav>
    
  </aside>

  <main class="flex-1 bg-slate-950 relative">
    <iframe id="content" class="w-full h-full border-none"></iframe>
  </main>

<script>
/* ===============================
   ROUTING
================================ */
const ROUTE_MAP = {
  "/componenti": "componenti.html",
  "/porto":   "porto.html",
  "/vascello":      "vascello.html",
  "/previsione_domanda": "previsione_domanda.html",
  "/modello_consumo": "modello_consumo.html",
};

function parseHash() {
  const raw = location.hash.slice(1) || "/componenti";
  const [route, query] = raw.split("?");
  return { route, query };
}

function loadFromHash() {
  const { route, query } = parseHash();
  const validRoute = ROUTE_MAP[route] ? route : "/componenti";
  const page = ROUTE_MAP[validRoute];
  const cacheBust = `_cb=${Date.now()}`;
  const src  = query ? `${page}?${query}&${cacheBust}` : `${page}?${cacheBust}`;

  const iframe = document.getElementById("content");
  iframe.src = src;
  
  highlight(validRoute);
}

/* ===============================
   HIGHLIGHTING LOGIC (SOLO TESTO, COLORE BLU)
================================ */
function highlight(activeRoute) {
  document.querySelectorAll(".nav-btn").forEach(btn => {
    const isActive = btn.dataset.route === activeRoute;
    
    // Reset classe base (senza flex/gap/svg)
    // text-left: allinea il testo a sinistra
    // pl-6: padding sinistro generoso per eleganza
    btn.className = "nav-btn w-full text-left pl-6 pr-4 py-4 text-lg font-bold rounded-xl transition-all duration-200 focus:outline-none focus:ring-0";

    if (isActive) {
       // === ATTIVO: BLU ELETTRICO ===
       btn.classList.add("bg-blue-800", "text-white");
    } else {
       // === INATTIVO: BLU NOTTE ===
       btn.classList.add("bg-blue-800/20", "text-blue-200", "hover:bg-blue-800");
    }
  });
}

/* ===============================
   CLICK HANDLER
================================ */
document.querySelectorAll(".nav-btn").forEach(btn => {
  btn.onclick = () => {
    const { query } = parseHash();
    const nextHash = btn.dataset.route + (query ? `?${query}` : "");
    if (location.hash.slice(1) === nextHash) {
      loadFromHash();
    } else {
      location.hash = nextHash;
    }
  };
});

/* ===============================
   INIT
================================ */
window.addEventListener("hashchange", loadFromHash);
loadFromHash();
</script>

</body>
</html>
